<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>STUDIO - ABOUT</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .about {
      text-align: center;
      padding: 80px 20px;
      opacity: 0;
      animation: fadeIn 1.5s ease-in forwards;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #6a4bc9;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5em;
      margin: 0 auto 20px;
      opacity: 0;
      transform: scale(0.8);
      animation: popUp 1s ease-out forwards;
      animation-delay: 0.5s;
    }

    .about h1 {
      font-size: 2em;
      color: #6a4bc9;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(-20px);
      animation: slideDown 1s ease-out forwards;
      animation-delay: 0.8s;
    }

    .subtitle {
      font-size: 1.2em;
      color: #6a4bc9;
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeInText 1.2s ease-in forwards;
      animation-delay: 1.1s;
    }

    .category-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
      opacity: 0;
      transform: scale(0.9);
      animation: popUp 0.8s ease-out forwards;
      animation-delay: 1.4s;
    }

    .category-buttons button {
      background: #6a4bc9;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .category-buttons button:hover {
      background: #ff66b2;
    }

    .timeline {
      max-width: 600px;
      margin: 40px auto;
      text-align: left;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 1.5s ease-in forwards;
      animation-delay: 1.8s;
    }

    .timeline h2 {
      text-align: center;
      color: #6a4bc9;
      margin-bottom: 20px;
    }

    .timeline ul {
      list-style: none;
      padding: 0;
    }

    .timeline ul li {
      margin-bottom: 15px;
      padding-left: 10px;
      border-left: 3px solid #6a4bc9;
    }

    /* 애니메이션 정의 */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideDown {
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeInText {
      to { opacity: 1; }
    }

    @keyframes popUp {
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="about.html">ABOUT</a></li>
      <li><a href="works.html">WORKS</a></li>
      <li><a href="news.html">NEWS</a></li>
      <li><a href="life.html">LIFE</a></li>
      <li><a href="contact.html">CONTACT</a></li>
    </ul>
  </nav>

  <section class="about">
    <div class="logo">L</div>
    <h1>Lumi</h1>
    <p class="subtitle">ARTIST · CREATOR</p>

    <div class="category-buttons">
      <button>학업</button>
      <button>프로젝트</button>
      <button>음악</button>
      <button>소설</button>
    </div>

    <p>
      작업물을 기록하는 사람<br>
      안녕하세요, 이곳은 배너, 이모지 등을 담아두는 공간이에요.<br>
      천천히 둘러보셨으면 합니다.<br>
      ‘배너,이모지 — 프로젝트’
    </p>

    <div class="timeline">
      <h2>타임라인</h2>
      <ul>
        <li><strong>2026:</strong> [작성]</li>
        <li><strong>2025:</strong> [작성]</li>
        <li><strong>2024:</strong> [작성]</li>
        <li><strong>2023:</strong> [작성]</li>
      </ul>
    </div>
  </section>

  <footer>
    OFFICIAL STUDIO © 2026 STUDIO ALL RIGHTS RESERVED
  </footer>
</body>
</html>
