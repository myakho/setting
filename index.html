<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 음성 대화 비서</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; max-width: 600px; margin: 0 auto; }
    #chat-box { border: 1px solid #ddd; padding: 15px; border-radius: 8px; min-height: 150px; text-align: left; margin-bottom: 20px; }
    .user { color: #0066cc; font-weight: bold; margin-bottom: 10px; }
    .ai { color: #2e7d32; margin-bottom: 10px; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 20px; border: none; background: #0066cc; color: white; }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>

  <h1>🤖 AI 음성 대화 비서</h1>
  <div id="chat-box">
    <p>아래 버튼을 누르고 질문을 말씀하세요.</p>
  </div>
  <button id="start-btn">🎙️ 말하기 시작</button>

  <script>
    const startBtn = document.getElementById('start-btn');
    const chatBox = document.getElementById('chat-box');

    // 1. STT (음성 인식) 설정
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;

    if (recognition) {
      recognition.lang = 'ko-KR';

      recognition.onstart = () => {
        startBtn.textContent = '듣는 중...';
        startBtn.disabled = true;
      };

      recognition.onresult = async (event) => {
        const userText = event.results[0][0].transcript;
        appendMessage('나', userText, 'user');

        // 2. AI에게 질문 전달 및 답변 수신
        const aiResponse = await getAIResponse(userText);
        appendMessage('AI', aiResponse, 'ai');

        // 3. TTS (음성 읽어주기) 실행
        speakText(aiResponse);
      };

      recognition.onend = () => {
        startBtn.textContent = '🎙️ 말하기 시작';
        startBtn.disabled = false;
      };

      startBtn.addEventListener('click', () => recognition.start());
    }

    // AI 답변 요청 함수 (Gemini API 연동)
    async function getAIResponse(prompt) {
      // ⚠️ 실제 서비스 시에는 발급받은 본인의 API Key 입력 필요
      const API_KEY = "YOUR_GEMINI_API_KEY"; 
      
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt + " (대답은 음성으로 들려줄 거니까 2~3문장 이내로 짧게 작성해 줘)" }] }]
          })
        });
        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
      } catch (error) {
        return "죄송해요, 답변을 처리하는 중 오류가 발생했습니다.";
      }
    }

    // 브라우저 TTS 실행 함수
    function speakText(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      window.speechSynthesis.speak(utterance);
    }

    // 채팅 화면 출력 함수
    function appendMessage(sender, text, className) {
      const p = document.createElement('p');
      p.className = className;
      p.innerHTML = `<strong>${sender}:</strong> ${text}`;
      chatBox.appendChild(p);
    }
  </script>
</body>
</html>
