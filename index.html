<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제2장 인간발달의 기저 — 발표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --ink:#12203A;--mute:#6A7A93;--faint:#9AA8BC;--line:#DFE6EF;
  --plum:#7A2E8E;--plum-l:#F5EAF8;--teal:#0D8E9E;--teal-l:#E3F4F6;
  --coral:#E2503F;--coral-l:#FCEDEB;--blue:#2C6FBF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;min-height:100dvh;
  background:#fff;color:var(--ink);
  font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;
  word-break:keep-all;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(24px,4vh,56px) clamp(22px,4vw,56px);
}
.slide{width:100%;max-width:1060px}

/* ── 머리글 ── */
.course{
  font-size:clamp(12.5px,1.2vw,15px);font-weight:700;color:var(--mute);
  padding-bottom:12px;border-bottom:1.5px solid var(--line);
}

/* ── 제목 ── */
.title{margin:clamp(36px,7vh,76px) 0 clamp(40px,8vh,84px)}
.chapter{
  font-size:clamp(16px,1.9vw,23px);font-weight:800;color:var(--plum);
  letter-spacing:-.02em;margin-bottom:clamp(6px,1.2vh,14px);
}
h1{
  font-size:clamp(40px,7vw,84px);font-weight:800;
  letter-spacing:-.045em;line-height:1.06;
}
.lead{
  font-size:clamp(14.5px,1.5vw,19px);color:var(--mute);font-weight:500;
  line-height:1.65;margin-top:clamp(14px,2.2vh,24px);max-width:36ch;
}

/* ── 차례 ── */
.agenda{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,26px)}
.p{
  display:block;min-width:0;text-decoration:none;color:inherit;
  border-top:3px solid var(--line);padding:14px 12px 14px 0;
  transition:background-color .2s,padding-left .2s;
}
.p:hover,.p:focus-visible{padding-left:12px}
.p:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.p1{border-top-color:var(--plum)}  .p1:hover,.p1:focus-visible{background:var(--plum-l)}
.p2{border-top-color:var(--teal)}  .p2:hover,.p2:focus-visible{background:var(--teal-l)}
.p3{border-top-color:var(--coral)} .p3:hover,.p3:focus-visible{background:var(--coral-l)}
.p .num{font-size:12.5px;font-weight:800}
.p1 .num{color:var(--plum)} .p2 .num{color:var(--teal)} .p3 .num{color:var(--coral)}
.p .t{
  font-size:clamp(16px,1.7vw,22px);font-weight:800;line-height:1.3;
  letter-spacing:-.025em;margin-top:7px;
}
.p .d{font-size:13px;color:var(--mute);font-weight:500;line-height:1.6;margin-top:9px}

/* ── 등장 ── */
.course,.title,.agenda{animation:rise .7s cubic-bezier(.22,.61,.36,1) both}
.title{animation-delay:.08s}
.agenda{animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .course,.title,.agenda{animation:none}.p{transition:none}
}

@media(max-width:760px){
  .agenda{grid-template-columns:1fr;gap:0}
  .p{padding:13px 0}
  .p .d{margin-top:5px}
  .title{margin:32px 0 36px}
}
</style>
</head>
<body>
<div class="slide">

  <div class="course">발달심리학 조별 발표</div>

  <div class="title">
    <div class="chapter">제2장</div>
    <h1>인간발달의 기저</h1>
    <p class="lead">아기가 세상에 태어나기 이전까지 이루어지는 발달적 현상들</p>
  </div>

  <nav class="agenda">
    <a class="p p1" href="part1.html">
      <div class="num">파트 1</div>
      <div class="t">발달의 생물학적 기저</div>
      <div class="d">수정과 세포분열, 성의 결정, 유전적 특성의 결정, 염색체 결함</div>
    </a>
    <a class="p p2" href="part2.html">
      <div class="num">파트 2</div>
      <div class="t">발달의 유전 및 경험적 기저</div>
      <div class="d">유전-환경 상호작용의 개념적 모형, 지능과 성격발달의 유전적 기저</div>
    </a>
    <a class="p p3" href="part3.html">
      <div class="num">파트 3</div>
      <div class="t">태내발달</div>
      <div class="d">태내발달단계, 태내발달에 영향을 미치는 여섯 가지 요인</div>
    </a>
  </nav>

</div>
</body>
</html>
