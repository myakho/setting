<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 음성 인식 웹앱</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; }
    #result { margin-top: 20px; padding: 15px; border: 1px solid #ccc; min-height: 100px; border-radius: 8px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>🎙️ AI 음성 인식 (GitHub Pages)</h1>
  <button id="start-btn">음성 인식 시작</button>
  <div id="result">여기에 인식된 텍스트가 표시됩니다...</div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const resultDiv = document.getElementById('result');

    // Web Speech API 지원 여부 확인
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR'; // 한국어 설정
      recognition.continuous = false; // 단발성 인식 (지속 인식을 원하면 true)
      recognition.interimResults = true; // 중간 결과 반환

      recognition.onstart = () => {
        startBtn.textContent = '듣고 있는 중...';
        resultDiv.textContent = '말씀해 주세요...';
      };

      recognition.onresult = (event) => {
        const transcript = Array.from(event.results)
          .map(result => result[0].transcript)
          .join('');
        resultDiv.textContent = transcript;
      };

      recognition.onerror = (event) => {
        resultDiv.textContent = '오류 발생: ' + event.error;
        startBtn.textContent = '음성 인식 시작';
      };

      recognition.onend = () => {
        startBtn.textContent = '음성 인식 시작';
      };

      startBtn.addEventListener('click', () => {
        recognition.start();
      });
    } else {
      resultDiv.textContent = '이 브라우저는 음성 인식을 지원하지 않습니다. (Chrome 권장)';
    }
  </script>
</body>
</html>
