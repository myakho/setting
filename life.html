<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>STUDIO - LIFE</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .life {
      text-align: center;
      padding: 80px 20px;
      opacity: 0;
      animation: fadeIn 1.5s ease-in forwards;
    }

    .life h1 {
      font-size: 2.5em;
      color: #6a4bc9;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(-30px);
      animation: slideDown 1.2s ease-out forwards;
      animation-delay: 0.5s;
    }

    .subtitle {
      font-size: 1.2em;
      color: #6a4bc9;
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeInText 1.2s ease-in forwards;
      animation-delay: 0.8s;
    }

    .category-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
      opacity: 0;
      transform: scale(0.9);
      animation: popUp 0.8s ease-out forwards;
      animation-delay: 1.2s;
    }

    .category-buttons button {
      background: #6a4bc9;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .category-buttons button:hover {
      background: #ff66b2;
    }

    /* 리스트형 카드 레이아웃 */
    #posts {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 30px;
      align-items: center;
    }

    .post {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.95);
      border-radius: 15px;
      width: 90%;
      max-width: 800px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.3s;
    }

    .post:hover {
      transform: translateY(-5px);
    }

    .post img {
      width: 180px;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      margin-right: 15px;
    }

    .post-content {
      flex: 1;
      text-align: left;
    }

    .post-content h3 {
      font-size: 1.1em;
      color: #6a4bc9;
      margin-bottom: 5px;
    }

    .post-content p {
      margin: 3px 0;
    }

    .tags {
      font-size: 0.8em;
      color: #ff66b2;
      font-weight: bold;
    }

    .date {
      font-size: 0.75em;
      color: #999;
    }

    .icon {
      font-size: 2em;
      color: #ff66b2;
      margin-top: 20px;
      opacity: 0;
      animation: fadeIn 1.5s ease-in forwards;
      animation-delay: 1.5s;
    }

    /* 모달 스타일 */
    #modal {
      display:none;
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.6);
      justify-content:center;
      align-items:center;
    }
    #modalContent {
      background:white;
      padding:20px;
      border-radius:10px;
      max-width:600px;
      width:90%;
      position:relative;
    }
    #modalContent span {
      position:absolute;
      top:10px; right:15px;
      cursor:pointer;
      font-size:1.5em;
    }

    /* 애니메이션 정의 */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideDown { to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeInText { to { opacity: 1; } }
    @keyframes popUp { to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <!-- 네비게이션 -->
  <nav>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="about.html">ABOUT</a></li>
      <li><a href="works.html">WORKS</a></li>
      <li><a href="news.html">NEWS</a></li>
      <li><a href="life.html">LIFE</a></li>
      <li><a href="contact.html">CONTACT</a></li>
    </ul>
  </nav>

  <!-- LIFE 섹션 -->
  <section class="life">
    <h1>LIFE</h1>
    <p class="subtitle">IN-BETWEEN MOMENTS</p>
    <div class="icon">🌸</div>

    <!-- 카테고리 버튼 -->
    <div class="category-buttons">
      <button onclick="filterTag('전체')">전체</button>
      <button onclick="filterTag('일상')">일상</button>
      <button onclick="filterTag('음악')">음악</button>
      <button onclick="filterTag('작업')">작업</button>
      <button onclick="filterTag('메모')">메모</button>
    </div>

    <!-- 게시물 출력 영역 -->
    <div id="posts"></div>
  </section>

  <!-- 모달 -->
  <div id="modal">
    <div id="modalContent">
      <span onclick="closeModal()">✖</span>
      <h3 id="modalTitle"></h3>
      <p id="modalBody"></p>
      <img id="modalImage" style="max-width:100%; border-radius:10px; margin-top:10px; display:none;">
      <p id="modalTags" style="font-size:0.9em; color:#666; margin-top:8px;"></p>
      <p id="modalDate" style="font-size:0.85em; color:#999; margin-top:5px;"></p>
    </div>
  </div>

  <!-- 푸터 -->
  <footer>
    OFFICIAL STUDIO © 2026 LUMI·STUDIO ALL RIGHTS RESERVED
  </footer>

  <script>
    let allPosts = [];
    let currentPosts = [];

    fetch("posts/life.json")
      .then(res => res.json())
      .then(posts => {
        allPosts = posts;
        currentPosts = [...allPosts];
        renderPosts(currentPosts);
      });

    function renderPosts(posts) {
      const container = document.getElementById("posts");
      container.innerHTML = "";
      posts.forEach((post, index) => {
        container.innerHTML += `
          <div class="post" onclick="openModal(${index})">
            ${post.image ? `<img src="${post.image}" alt="${post.title}">` : ""}
            <div class="post-content">
              <h3>${post.title}</h3>
              <p>${post.content.substring(0, 50)}...</p>
              <p class="tags">${post.tags.join(", ")}</p>
              ${post.date ? `<p class="date">${post.date}</p>` : ""}
            </div>
          </div>
        `;
      });
    }

    function openModal(index) {
      const post = currentPosts[index];
      document.getElementById("modalTitle").innerText = post.title;
      document.getElementById("modalBody").innerText = post.content;
      if (post.image) {
        document.getElementById("modalImage").src = post.image;
        document.getElementById("modalImage").style.display = "block";
      } else {
        document.getElementById("modalImage").style.display = "none";
      }
      document.getElementById("modalTags").innerText = "태그: " + post.tags.join(", ");
      document.getElementById("modalDate").innerText = post.date ? "작성일: " + post.date : "";
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    function filterTag(tag) {
      if (tag === "전체") {
        currentPosts = [...allPosts];
      } else {
        currentPosts = allPosts.filter(post => post.tags.includes(tag));
      }
      renderPosts(currentPosts);
    }
  </script>
</body>
</html>
