<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>STUDIO - CONTACT</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .contact {
      text-align: center;
      padding: 80px 20px;
      opacity: 0;
      animation: fadeIn 1.5s ease-in forwards;
    }

    .contact h1 {
      font-size: 2.5em;
      color: #6a4bc9;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(-30px);
      animation: slideDown 1.2s ease-out forwards;
      animation-delay: 0.5s;
    }

    .subtitle {
      font-size: 1.2em;
      color: #6a4bc9;
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeInText 1.2s ease-in forwards;
      animation-delay: 0.8s;
    }

    .contact p {
      font-size: 1em;
      color: #4a3f7f;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeInText 1.2s ease-in forwards;
      animation-delay: 1s;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
      opacity: 0;
      transform: scale(0.9);
      animation: popUp 0.8s ease-out forwards;
      animation-delay: 1.4s;
    }

    .contact-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .contact-card:hover {
      transform: translateY(-5px);
    }

    .contact-card h3 {
      margin: 0 0 10px;
      color: #6a4bc9;
    }

    .contact-card p {
      margin: 0;
      color: #4a3f7f;
    }

    .contact-card a {
      color: #4a3f7f;
      text-decoration: none;
    }

    .contact-card a:hover {
      color: #ff66b2;
    }

    /* 애니메이션 정의 */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideDown {
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeInText {
      to { opacity: 1; }
    }

    @keyframes popUp {
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
